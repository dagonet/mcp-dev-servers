[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-dev-servers"
version = "0.3.9"
description = "FastMCP servers for Claude Code: git, GitHub, .NET, Ollama, Rust, Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "dagonet" }]
keywords = ["mcp", "claude", "fastmcp", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
# mcp 2.x renamed FastMCP to MCPServer and ships mcp/server/fastmcp.py as a
# tombstone that raises ModuleNotFoundError on import. Every server in this
# package does `from mcp.server.fastmcp import FastMCP`, so an unpinned install
# resolves 2.x and all seven fail to start. Measured against the 2.2.0 wheel.
dependencies = ["mcp[cli]>=1.2,<2"]

[project.optional-dependencies]
ollama = ["httpx"]
git = []
github = []
dotnet = []
rust = []
python-tools = []
dev = ["pytest", "build", "twine"]

[project.scripts]
mcp-git-tools = "mcp_dev_servers.git_mcp:main"
mcp-github-tools = "mcp_dev_servers.github_mcp:main"
mcp-dotnet-tools = "mcp_dev_servers.dotnet_mcp:main"
mcp-ollama-tools = "mcp_dev_servers.ollama_mcp:main"
mcp-rust-tools = "mcp_dev_servers.rust_mcp:main"
mcp-python-tools = "mcp_dev_servers.python_tools_mcp:main"

[project.urls]
Homepage = "https://github.com/dagonet/mcp-dev-servers"
Issues = "https://github.com/dagonet/mcp-dev-servers/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dev_servers"]
